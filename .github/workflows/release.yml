# Jeder Push auf main wird ein Release mit genau einer APK und einem RPM (Plan 10.2, F016, F017).
name: Release
on:
  push:
    branches: [main]

# Eine repositoryweite Gruppe; kein Abbruch, alle wartenden Läufe bleiben in der Warteschlange.
concurrency:
  group: markdoist-release-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  SHA: ${{ github.sha }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: v
        env:
          OFFSET: ${{ vars.VERSION_CODE_OFFSET || '0' }}
          RUN: ${{ github.run_number }}
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          code=$((OFFSET + RUN))
          echo "version=${base}.${code}" >> "$GITHUB_OUTPUT"
          echo "version_code=${code}" >> "$GITHUB_OUTPUT"
          echo "Version ${base}.${code} (versionCode ${code}) für ${SHA}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:tz

  android:
    needs: [meta, test]
    runs-on: ubuntu-latest
    env:
      MARKDOIST_VERSION: ${{ needs.meta.outputs.version }}
      MARKDOIST_VERSION_CODE: ${{ needs.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Prebuild
        run: pnpm --filter mobile exec expo prebuild --platform android --clean --no-install
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.MARKDOIST_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret MARKDOIST_KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MARKDOIST_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        env:
          MARKDOIST_KEYSTORE_PASSWORD: ${{ secrets.MARKDOIST_KEYSTORE_PASSWORD }}
          MARKDOIST_KEY_ALIAS: ${{ secrets.MARKDOIST_KEY_ALIAS }}
          MARKDOIST_KEY_PASSWORD: ${{ secrets.MARKDOIST_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: APK prüfen und benennen
        env:
          CERT: ${{ vars.MARKDOIST_CERT_SHA256 }}
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump badging "$apk" | head -1 | tee badging.txt
          grep -q "name='de.markdoist.aufgaben'" badging.txt
          grep -q "versionCode='${MARKDOIST_VERSION_CODE}'" badging.txt
          grep -q "versionName='${MARKDOIST_VERSION}'" badging.txt
          "$bt/apksigner" verify --print-certs "$apk" | tee certs.txt
          if [ -n "$CERT" ]; then
            want=$(echo "$CERT" | tr -d ':' | tr 'A-F' 'a-f')
            grep -qi "SHA-256 digest: ${want}" certs.txt || { echo "Unerwartete Signatur"; exit 1; }
          fi
          mkdir -p dist
          cp "$apk" "dist/markdoist-${MARKDOIST_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  rpm:
    needs: [meta, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - name: RPM bauen
        working-directory: apps/desktop
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --linux rpm --publish never -c.extraMetadata.version="$VERSION"
      - run: |
          mkdir -p dist
          cp "apps/desktop/release/markdoist-${VERSION}.x86_64.rpm" dist/
          rpm -qp --queryformat '%{NAME} %{VERSION}\n' dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    needs: [meta, android, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_CODE: ${{ needs.meta.outputs.version_code }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assets prüfen
        run: |
          ls -la dist
          test "$(ls dist/*.apk | wc -l)" = 1
          test "$(ls dist/*.rpm | wc -l)" = 1
          test -f "dist/markdoist-${VERSION}.apk"
          test -f "dist/markdoist-${VERSION}.x86_64.rpm"
          (cd dist && sha256sum * > ../SHA256SUMS && cat ../SHA256SUMS)
      - name: Release anlegen oder ergänzen
        run: |
          tag="v${VERSION}"
          notes="Automatisches Testrelease.

          - Version: ${VERSION}
          - versionCode: ${VERSION_CODE}
          - Commit: ${SHA}
          - Lauf: ${{ github.run_id }} (Versuch ${{ github.run_attempt }})

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`"
          if gh release view "$tag" --json isDraft,targetCommitish > rel.json 2>/dev/null; then
            # Rerun: vorhandenes Release dieses Laufs prüfen
            ref=$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null || true)
            if [ -n "$ref" ] && [ "$ref" != "$SHA" ]; then
              echo "Tag ${tag} zeigt auf ${ref}, nicht auf ${SHA} – Abbruch"; exit 1
            fi
            if [ "$(jq -r .isDraft rel.json)" = "false" ]; then
              echo "Release ${tag} ist bereits veröffentlicht – nichts zu tun"
              echo "DONE=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Entwurf ${tag} vorhanden – Assets ergänzen"
          else
            gh release create "$tag" --target "$SHA" --draft --title "Markdoist ${VERSION}" --notes "$notes" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
      - name: Hochgeladene Assets verifizieren
        if: env.DONE != '1'
        run: |
          mkdir check && gh release download "v${VERSION}" -D check
          (cd check && sha256sum -c ../SHA256SUMS)
          test "$(ls check | wc -l)" = 2
      - name: Veröffentlichen (Latest nur für die höchste Version)
        if: env.DONE != '1'
        run: |
          tag="v${VERSION}"
          highest=$(gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft==false and .isPrerelease==false) | .tagName | ltrimstr("v")] | .[]' \
            | sort -V | tail -1)
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
            gh release edit "$tag" --draft=false --latest
          else
            echo "Höhere Version ${highest} bereits veröffentlicht – ${tag} wird nicht Latest"
            gh release edit "$tag" --draft=false --latest=false
          fi
