# Wartet auf das Ende des Abgleichs, öffnet die Einstellungen (Kennzahlen) und führt eine Suche aus.
appId: de.markdoist.aufgaben
---
- extendedWaitUntil:
    notVisible:
      id: scan-progress
    timeout: 180000
- tapOn:
    id: nav-menu
- tapOn:
    id: nav-settings
# Die Messwerte stehen eingeklappt unter „Über“.
- scrollUntilVisible:
    element:
      id: scan-stats
    direction: DOWN
    timeout: 180000
- tapOn:
    id: scan-stats
- extendedWaitUntil:
    visible:
      id: last-scan
    timeout: 10000
