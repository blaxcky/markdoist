# Kennzahlen lesen: letzter Abgleich (Einstellungen) und Suchdauer.
appId: de.markdoist.aufgaben
---
- extendedWaitUntil:
    notVisible:
      id: scan-progress
    timeout: 120000
- tapOn:
    id: nav-settings
- extendedWaitUntil:
    visible:
      id: last-scan
    timeout: 60000
- copyTextFrom:
    id: last-scan
- evalScript: ${output.scan = maestro.copiedText}
- back
- tapOn:
    id: nav-search
- tapOn:
    id: search-input
- inputText: "bettwasche schritt"
- extendedWaitUntil:
    visible:
      id: search-stats
    timeout: 10000
- copyTextFrom:
    id: search-stats
- evalScript: ${console.log("MARKDOIST_PERF scan=" + output.scan + " | search=" + maestro.copiedText)}
