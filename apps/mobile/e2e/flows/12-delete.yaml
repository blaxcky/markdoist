# Löschen (4.4): Die Aufgabe verschwindet sofort, das Verschieben in den Papierkorb läuft im Hintergrund.
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-inbox
- tapOn:
    id: fab-capture
- tapOn:
    id: capture-title
- inputText: "Wegwerfen"
- tapOn:
    id: capture-submit
- assertVisible:
    id: row-Wegwerfen
# Aus dem Detail: Es schließt sofort, die Zeile ist weg; das Löschen steht im Verlauf, nicht in einer Meldung.
- tapOn:
    id: row-Wegwerfen
- tapOn:
    id: detail-menu
- tapOn:
    id: delete
- assertNotVisible:
    id: row-Wegwerfen
- assertNotVisible:
    id: snackbar
- tapOn:
    id: fab-capture
- tapOn:
    id: capture-title
- inputText: "Auch weg"
- tapOn:
    id: capture-submit
# Über das Aktionsblatt (langes Drücken).
- longPressOn:
    id: row-Auch weg
- tapOn:
    id: act-delete
- assertNotVisible:
    id: row-Auch weg
# Rückgängig über den Verlauf im Drei-Punkte-Menü (4.4).
- tapOn:
    id: nav-menu
- tapOn:
    id: nav-history
- assertVisible:
    id: "history-Wegwerfen"
- tapOn:
    id: "history-undo-Auch weg"
- assertVisible: "Zurückgenommen"
- back
- assertVisible:
    id: row-Auch weg
