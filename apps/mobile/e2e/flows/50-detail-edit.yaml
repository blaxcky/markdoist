# Priorität setzen, Notiz bearbeiten (Autosave), WebView-Vorschau öffnen.
# Text in der WebView sieht Maestro nicht; Checkbox-Umschalten ist per adb-Tap geprüft (docs/ABNAHME.md).
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
# Über „Alle“: Nach Flow 45 hat die Aufgabe eine Frist und steht nicht mehr im Eingang (4.2a, seit 09.11.2026).
- tapOn:
    id: tab-all
- tapOn:
    id: "row-Zahnarzttermin vereinbaren"
# Priorität liegt hinter dem Chip „Priorität“ (Auswahlblatt).
- tapOn:
    id: field-priority
- tapOn:
    id: priority-high
- scrollUntilVisible:
    element:
      id: editor
- tapOn:
    id: editor
- inputText: " Neu"
# Kein hideKeyboard: Ist die Tastatur schon zu, drückt es „Zurück“ und verlässt das Detail.
# Die Speicheranzeige steht über dem Editor; je nach Tastatur liegt sie ober- oder unterhalb.
- scrollUntilVisible:
    element:
      id: save-state
    direction: UP
    timeout: 6000
    optional: true
- scrollUntilVisible:
    element:
      id: save-state
- extendedWaitUntil:
    visible: "Gespeichert"
    timeout: 8000
- tapOn:
    id: tab-preview
- assertVisible:
    id: preview
- back
