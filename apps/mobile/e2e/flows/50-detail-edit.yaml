# Priorität setzen, Notiz bearbeiten (Autosave), WebView-Vorschau öffnen.
# Text in der WebView sieht Maestro nicht; Checkbox-Umschalten ist per adb-Tap geprüft (docs/ABNAHME.md).
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-inbox
- tapOn: "Zahnarzttermin vereinbaren"
- tapOn:
    id: priority-high
- scrollUntilVisible:
    element:
      id: editor
- tapOn:
    id: editor
- inputText: " Neu"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: save-state
- extendedWaitUntil:
    visible: "Gespeichert"
    timeout: 8000
- tapOn:
    id: tab-preview
- assertVisible:
    id: preview
- back
