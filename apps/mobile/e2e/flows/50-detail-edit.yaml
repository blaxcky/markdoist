# Priorität setzen, Notiz bearbeiten (Autosave), WebView-Vorschau öffnen.
# Text in der WebView sieht Maestro nicht; Checkbox-Umschalten ist per adb-Tap geprüft (docs/ABNAHME.md).
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-inbox
- tapOn: "Zahnarzttermin vereinbaren"
- tapOn:
    id: priority-high
# Die Snackbar „Priorität geändert“ liegt unten über dem Editor; erst danach ins Textfeld tippen.
- extendedWaitUntil:
    notVisible:
      id: snackbar
    timeout: 8000
- scrollUntilVisible:
    element:
      id: editor
- tapOn:
    id: editor
- inputText: " Neu"
# Kein hideKeyboard: Ist die Tastatur schon zu, drückt es „Zurück“ und verlässt das Detail.
# Die Speicheranzeige steht über dem Editor; je nach Tastatur liegt sie ober- oder unterhalb.
- scrollUntilVisible:
    element:
      id: save-state
    direction: UP
    timeout: 6000
    optional: true
- scrollUntilVisible:
    element:
      id: save-state
- extendedWaitUntil:
    visible: "Gespeichert"
    timeout: 8000
- tapOn:
    id: tab-preview
- assertVisible:
    id: preview
- back
