# Ausnahme (5.4): den übernächsten Termin der Serie überspringen.
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-all
- tapOn: "Wochenrückblick"
- scrollUntilVisible:
    element:
      id: "exception-${SKIP_KEY}"
- tapOn:
    id: "exception-${SKIP_KEY}"
- assertVisible: "Termin wird übersprungen"
- back
