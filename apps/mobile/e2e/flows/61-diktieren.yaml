# Diktieren (4.9, 4.10, 4.12): Knopf nur bei Programmier-Einträgen und im Eingabeblatt eines Boards; ohne Schlüssel Hinweis und Einstellungen;
# Schlüssel speichern (nur maskiert sichtbar) und entfernen; Aufnahme starten und abbrechen; Claude als Text-Anbieter.
# Netz und OpenAI prüft Maestro nicht (kein echter Schlüssel im Test).
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-more
- tapOn:
    id: more-dev
- tapOn:
    id: fab-new-dev-list
- inputText: "Diktat"
- tapOn:
    id: new-list-create
- tapOn:
    id: fab-add-dev-item
- inputText: "Sprachnotiz"
- tapOn:
    id: add-item-send
- tapOn:
    id: sheet-close
- tapOn:
    id: "text-Sprachnotiz"
# Die Notiz enthält schon den Text, darum steht „Diktieren“ in der Beschreibungskarte.
- assertVisible:
    id: dictate
# Ohne Schlüssel: Hinweis, dann die Einstellungen
- tapOn:
    id: dictate
- extendedWaitUntil:
    visible: ".*API-Schlüssel in den Einstellungen.*"
    timeout: 4000
- scrollUntilVisible:
    element:
      id: dictation-key
    direction: DOWN
    timeout: 8000
- tapOn:
    id: dictation-key
- inputText: "sk-test-maestro-1234"
- hideKeyboard
- tapOn:
    id: dictation-key-save
- extendedWaitUntil:
    visible:
      id: dictation-key-masked
      text: "sk-…1234"
    timeout: 4000
- assertNotVisible: ".*maestro.*"
- back
# Mit Schlüssel: Aufnahme startet (Berechtigung einmal erlauben) und lässt sich abbrechen.
- tapOn:
    id: dictate
# Der Berechtigungsdialog erscheint erst nach dem Antippen; warten, bis er oder die laufende Aufnahme da ist.
- extendedWaitUntil:
    visible: "(?i)while using the app|Aufnahme 0:0[1-9]"
    timeout: 8000
- runFlow:
    when:
      visible: "(?i)while using the app"
    commands:
      - tapOn: "(?i)while using the app"
- extendedWaitUntil:
    visible: "Aufnahme 0:0[1-9]"
    timeout: 8000
- tapOn:
    id: dictate-cancel
- extendedWaitUntil:
    visible:
      id: dictate
    timeout: 3000
# Echter Upload bis zu OpenAI (braucht Internet im Gerät): Der Testschlüssel ist ungültig, also antwortet
# OpenAI mit 401. Das beweist, dass die Aufnahme hinausgeht; kostet nichts. Vorher stand hier „Kein Netz“.
- tapOn:
    id: dictate
- extendedWaitUntil:
    visible: "Aufnahme 0:0[2-9]"
    timeout: 8000
- tapOn:
    id: dictate-stop
- extendedWaitUntil:
    visible:
      id: dictate-retry
    timeout: 30000
- assertVisible:
    id: dictate-state
    text: "API-Schlüssel ungültig"
- tapOn:
    id: dictate-cancel
- extendedWaitUntil:
    visible:
      id: dictate
    timeout: 3000
# Detail → Board. Diktieren im Eingabeblatt (4.10): startet sofort; mit ungültigem Schlüssel bleibt die
# Aufnahme für „Erneut versuchen“ erhalten.
- back
- tapOn:
    id: fab-add-dev-item
# Gegliedertes Blatt: Überschrift, Liste als Chip, Diktieren in der Aktionsleiste.
- assertVisible: "Neuer Eintrag"
- assertVisible:
    id: sheet-context
    text: "Diktat"
- tapOn:
    id: dictate
# Die Aufnahmekarte ersetzt die Aktionsleiste: Laufzeit steht für sich, „Ablegen“ ist ausgeblendet.
- extendedWaitUntil:
    visible:
      id: dictate-time
      text: "0:0[2-9]"
    timeout: 8000
- assertVisible:
    id: dictate-recording
- assertNotVisible:
    id: add-item-send
- tapOn:
    id: dictate-stop
- extendedWaitUntil:
    visible:
      id: dictate-retry
    timeout: 30000
- tapOn:
    id: dictate-cancel
- extendedWaitUntil:
    visible:
      id: add-item-send
    timeout: 3000
- tapOn:
    id: sheet-close
# Board → Übersicht mit unterer Leiste
- back
# Gewöhnliche Aufgaben haben keinen Diktierknopf.
- tapOn:
    id: tab-inbox
- runFlow:
    when:
      visible:
        id: "row-Maestro Aufgabe"
    commands:
      - tapOn:
          id: "row-Maestro Aufgabe"
      - assertNotVisible:
          id: dictate-chip
      - assertNotVisible:
          id: dictate
      - back
# Schlüssel wieder entfernen
- tapOn:
    id: nav-menu
- tapOn:
    id: nav-settings
# Diktieren hat eine eigene Seite; die Übersicht zeigt eine Zeile mit Zustand.
- assertVisible:
    id: dictation-status-pill
    text: "Bereit"
- tapOn:
    id: open-dictation
- scrollUntilVisible:
    element:
      id: dictation-key-remove
    direction: DOWN
    timeout: 8000
- tapOn:
    id: dictation-key-remove
- extendedWaitUntil:
    visible:
      id: dictation-key
    timeout: 4000
# Claude als Text-Anbieter (4.12): eigener Schlüssel, nur maskiert. „Prüfen“ geht echt zu api.anthropic.com
# (Claude-SDK unter Hermes); der Testschlüssel ist ungültig, also 401. Kostet nichts.
- scrollUntilVisible:
    element:
      id: dictation-text-anthropic
    direction: DOWN
    timeout: 8000
- tapOn:
    id: dictation-text-anthropic
- scrollUntilVisible:
    element:
      id: dictation-anthropic-key
    direction: DOWN
    timeout: 8000
- tapOn:
    id: dictation-anthropic-key
- inputText: "sk-ant-maestro-5678"
- hideKeyboard
- tapOn:
    id: dictation-anthropic-key-save
- extendedWaitUntil:
    visible:
      id: dictation-anthropic-key-masked
      text: "sk-…5678"
    timeout: 4000
- assertNotVisible: ".*maestro.*"
- tapOn:
    id: dictation-anthropic-key-check
# Die Meldung steht unter dem Schlüssel und kann unterhalb des sichtbaren Bereichs liegen.
- scrollUntilVisible:
    element:
      id: dictation-anthropic-status
      text: "API-Schlüssel ungültig"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dictation-anthropic-key-remove
- extendedWaitUntil:
    visible:
      id: dictation-anthropic-key
    timeout: 4000
- scrollUntilVisible:
    element:
      id: dictation-text-openai
    direction: UP
    timeout: 8000
- tapOn:
    id: dictation-text-openai
- assertNotVisible:
    id: dictation-anthropic-key
# Erkennung über Gemini (4.12): eigener Schlüssel; „Prüfen“ geht echt zu Google. Gemini meldet den ungültigen
# Testschlüssel als 400 „API key not valid“, die App zeigt „API-Schlüssel ungültig“. Kostet nichts.
- scrollUntilVisible:
    element:
      id: dictation-stt-gemini
    direction: UP
    timeout: 8000
- tapOn:
    id: dictation-stt-gemini
- scrollUntilVisible:
    element:
      id: dictation-gemini-key
    direction: DOWN
    timeout: 8000
- tapOn:
    id: dictation-gemini-key
- inputText: "AIza-maestro-9012"
- hideKeyboard
- tapOn:
    id: dictation-gemini-key-save
- extendedWaitUntil:
    visible:
      id: dictation-gemini-key-masked
      text: "AI…9012"
    timeout: 4000
# Modellnamen stehen unter „Erweitert“.
- scrollUntilVisible:
    element:
      id: dictation-advanced
    direction: DOWN
    timeout: 8000
- tapOn:
    id: dictation-advanced
- scrollUntilVisible:
    element:
      id: dictation-model-transcribe
      text: "gemini-3.5-transcribe"
    direction: DOWN
    timeout: 8000
- scrollUntilVisible:
    element:
      id: dictation-gemini-key-check
    direction: UP
    timeout: 8000
- tapOn:
    id: dictation-gemini-key-check
- scrollUntilVisible:
    element:
      id: dictation-gemini-status
      text: "API-Schlüssel ungültig"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: dictation-gemini-key-remove
- extendedWaitUntil:
    visible:
      id: dictation-gemini-key
    timeout: 4000
- scrollUntilVisible:
    element:
      id: dictation-stt-openai
    direction: UP
    timeout: 8000
- tapOn:
    id: dictation-stt-openai
- assertNotVisible:
    id: dictation-gemini-key
# Auf dem Gerät (4.12): Auswahl zeigt die Modellzeile statt Schlüssel und Modellname. Kein Download im Lauf
# (640 MB); je nach Gerät steht dort „Modell herunterladen“ oder „… ist bereit“.
- tapOn:
    id: dictation-stt-local
- extendedWaitUntil:
    visible:
      id: local-model
    timeout: 4000
- assertNotVisible:
    id: dictation-model-transcribe
- scrollUntilVisible:
    element:
      id: dataflow-recordings
      text: ".*Bleiben auf dem Gerät.*"
    direction: DOWN
    timeout: 8000
- scrollUntilVisible:
    element:
      id: dictation-stt-openai
    direction: UP
    timeout: 8000
- tapOn:
    id: dictation-stt-openai
- assertVisible:
    id: dictation-key
- back
- assertVisible:
    id: dictation-status-pill
    text: "Schlüssel fehlt"
- back
