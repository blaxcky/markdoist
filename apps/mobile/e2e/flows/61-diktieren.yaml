# Diktieren (4.9, 4.10): Knopf nur bei Programmier-Einträgen und im Eingabeblatt eines Boards; ohne Schlüssel Hinweis und Einstellungen;
# Schlüssel speichern (nur maskiert sichtbar) und entfernen; Aufnahme starten und abbrechen.
# Netz und OpenAI prüft Maestro nicht (kein echter Schlüssel im Test).
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-more
- tapOn:
    id: more-dev
- tapOn:
    id: fab-new-dev-list
- inputText: "Diktat"
- tapOn:
    id: new-list-create
- tapOn:
    id: fab-add-dev-item
- inputText: "Sprachnotiz"
- tapOn:
    id: add-item-send
- tapOn:
    id: sheet-close
- tapOn:
    id: "text-Sprachnotiz"
# Die Notiz enthält schon den Text, darum steht „Diktieren“ in der Beschreibungskarte.
- assertVisible:
    id: dictate
# Ohne Schlüssel: Hinweis, dann die Einstellungen
- tapOn:
    id: dictate
- extendedWaitUntil:
    visible: ".*API-Schlüssel in den Einstellungen.*"
    timeout: 4000
- scrollUntilVisible:
    element:
      id: dictation-key
    direction: DOWN
    timeout: 8000
- tapOn:
    id: dictation-key
- inputText: "sk-test-maestro-1234"
- hideKeyboard
- tapOn:
    id: dictation-key-save
- extendedWaitUntil:
    visible:
      id: dictation-key-masked
      text: "sk-…1234"
    timeout: 4000
- assertNotVisible: ".*maestro.*"
- back
# Mit Schlüssel: Aufnahme startet (Berechtigung einmal erlauben) und lässt sich abbrechen.
- tapOn:
    id: dictate
# Der Berechtigungsdialog erscheint erst nach dem Antippen; warten, bis er oder die laufende Aufnahme da ist.
- extendedWaitUntil:
    visible: "(?i)while using the app|Aufnahme 0:0[1-9]"
    timeout: 8000
- runFlow:
    when:
      visible: "(?i)while using the app"
    commands:
      - tapOn: "(?i)while using the app"
- extendedWaitUntil:
    visible: "Aufnahme 0:0[1-9]"
    timeout: 8000
- tapOn:
    id: dictate-cancel
- extendedWaitUntil:
    visible:
      id: dictate
    timeout: 3000
# Echter Upload bis zu OpenAI (braucht Internet im Gerät): Der Testschlüssel ist ungültig, also antwortet
# OpenAI mit 401. Das beweist, dass die Aufnahme hinausgeht; kostet nichts. Vorher stand hier „Kein Netz“.
- tapOn:
    id: dictate
- extendedWaitUntil:
    visible: "Aufnahme 0:0[2-9]"
    timeout: 8000
- tapOn:
    id: dictate-stop
- extendedWaitUntil:
    visible:
      id: dictate-retry
    timeout: 30000
- assertVisible:
    id: dictate-state
    text: "API-Schlüssel ungültig"
- tapOn:
    id: dictate-cancel
- extendedWaitUntil:
    visible:
      id: dictate
    timeout: 3000
# Detail → Board. Diktieren im Eingabeblatt (4.10): startet sofort; mit ungültigem Schlüssel bleibt die
# Aufnahme für „Erneut versuchen“ erhalten.
- back
- tapOn:
    id: fab-add-dev-item
- tapOn:
    id: dictate
- extendedWaitUntil:
    visible: "Aufnahme 0:0[2-9]"
    timeout: 8000
- tapOn:
    id: dictate-stop
- extendedWaitUntil:
    visible:
      id: dictate-retry
    timeout: 30000
- tapOn:
    id: dictate-cancel
- tapOn:
    id: sheet-close
# Board → Übersicht mit unterer Leiste
- back
# Gewöhnliche Aufgaben haben keinen Diktierknopf.
- tapOn:
    id: tab-inbox
- runFlow:
    when:
      visible:
        id: "row-Maestro Aufgabe"
    commands:
      - tapOn:
          id: "row-Maestro Aufgabe"
      - assertNotVisible:
          id: dictate-chip
      - assertNotVisible:
          id: dictate
      - back
# Schlüssel wieder entfernen
- tapOn:
    id: nav-menu
- tapOn:
    id: nav-settings
- scrollUntilVisible:
    element:
      id: dictation-key-remove
    direction: DOWN
    timeout: 8000
- tapOn:
    id: dictation-key-remove
- extendedWaitUntil:
    visible:
      id: dictation-key
    timeout: 4000
- back
