# Erledigen per Wischen nach rechts und Rückgängig über den Verlauf.
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-inbox
# Direkt nach Kaltstart und Tabwechsel kam die Wischgeste im Gesamtlauf teils nicht an: Startabgleich und
# Tabwechsel abwarten, bevor gewischt wird.
- extendedWaitUntil:
    notVisible: ".*wird geprüft.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# Im Gesamtlauf kommt die erste Wischgeste nach dem Start teils nicht an (auch vor 28.10.2026 reproduzierbar):
# dann erneut wischen. Eine angekommene Geste blendet die Zeile aus, die Wiederholung entfällt.
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: "row-Zahnarzttermin vereinbaren"
          direction: RIGHT
          duration: 250
      - extendedWaitUntil:
          notVisible: "Zahnarzttermin vereinbaren"
          timeout: 3000
# Keine Meldung mehr: Erledigen landet im Verlauf.
- assertNotVisible:
    id: snackbar
# Rückgängig über den Verlauf im Drei-Punkte-Menü (4.4).
- tapOn:
    id: nav-menu
- tapOn:
    id: nav-history
- assertVisible:
    id: "history-Zahnarzttermin vereinbaren"
- tapOn:
    id: "history-undo-Zahnarzttermin vereinbaren"
- assertVisible: "Zurückgenommen"
- back
- assertVisible: "Zahnarzttermin vereinbaren"
