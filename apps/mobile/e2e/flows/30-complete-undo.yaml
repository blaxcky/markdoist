# Erledigen per Wischen nach rechts und Rückgängig über die Snackbar.
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-inbox
# Direkt nach Kaltstart und Tabwechsel kam die Wischgeste im Gesamtlauf teils nicht an: Startabgleich und
# Tabwechsel abwarten, bevor gewischt wird.
- extendedWaitUntil:
    notVisible: ".*wird geprüft.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# Im Gesamtlauf kommt die erste Wischgeste nach dem Start teils nicht an (auch vor 28.10.2026 reproduzierbar):
# dann erneut wischen. Eine angekommene Geste zeigt die Snackbar, die Wiederholung entfällt.
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: "row-Zahnarzttermin vereinbaren"
          direction: RIGHT
          duration: 250
      - assertVisible:
          id: snackbar
# Zeile blendet aus und klappt ein; erst danach Rückgängig, sonst wäre der Titel ohnehin noch sichtbar.
- extendedWaitUntil:
    notVisible: "Zahnarzttermin vereinbaren"
    timeout: 3000
- tapOn:
    id: snackbar-undo
- assertVisible: "Zahnarzttermin vereinbaren"
