# Listen (4.6): anlegen, Einträge hinzufügen, Reihenfolge ziehen, abhaken, Haken zurücksetzen.
# Untere Leiste (4.5, AK-47): Erledigt und Listen liegen hinter „⋯ Mehr“, Zurück führt zur letzten Hauptansicht.
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- assertNotVisible:
    id: tab-lists
- assertNotVisible:
    id: tab-done
- tapOn:
    id: tab-more
- tapOn:
    id: more-done
- assertVisible: "Erledigt"
- pressKey: back
- assertVisible:
    id: tab-today
- assertNotVisible: "Erledigt"
- tapOn:
    id: tab-more
- tapOn:
    id: more-lists
- tapOn:
    id: fab-new-list
- inputText: "Einkauf"
- tapOn:
    id: new-list-create
# Einträge über das Eingabeblatt der Erfassung; es bleibt nach jedem Eintrag offen.
- tapOn:
    id: fab-add-item
- inputText: "Milch"
- pressKey: Enter
- assertVisible:
    id: add-item
- inputText: "Brot"
- pressKey: Enter
- tapOn:
    id: sheet-close
- extendedWaitUntil:
    visible:
      id: "check-Brot"
    timeout: 3000
# Brot am Griff über Milch ziehen
- swipe:
    from:
      id: "grip-Brot"
    direction: UP
    duration: 1500
- tapOn:
    id: "check-Milch"
- extendedWaitUntil:
    visible:
      id: checked-toggle
    timeout: 3000
- assertVisible: "1 von 2 abgehakt"
- tapOn:
    id: list-menu
- tapOn:
    id: reset-items
- assertVisible: "0 von 2 abgehakt"
- pressKey: back
- assertVisible:
    id: "progress-Einkauf"
    text: "0/2"
# Listen erscheinen nicht zwischen den Aufgaben
- tapOn:
    id: tab-all
- assertNotVisible: "Einkauf"
