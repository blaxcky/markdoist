# Erledigen per Tipp auf den Haken: nur erledigen, nicht zusätzlich das Detail öffnen.
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-inbox
- tapOn:
    id: "check-Zahnarzttermin vereinbaren"
- assertVisible:
    id: snackbar
- assertNotVisible:
    id: field-due
# Zeile blendet aus und klappt ein; erst danach Rückgängig, sonst wäre der Titel ohnehin noch sichtbar.
- extendedWaitUntil:
    notVisible: "Zahnarzttermin vereinbaren"
    timeout: 3000
- tapOn:
    id: snackbar-undo
- assertVisible: "Zahnarzttermin vereinbaren"
