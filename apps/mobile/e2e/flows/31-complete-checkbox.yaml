# Erledigen per Tipp auf den Haken: nur erledigen, nicht zusätzlich das Detail öffnen.
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-inbox
- tapOn:
    id: "check-Zahnarzttermin vereinbaren"
# Zeile blendet aus und klappt ein; erst danach Rückgängig, sonst wäre der Titel ohnehin noch sichtbar.
- extendedWaitUntil:
    notVisible: "Zahnarzttermin vereinbaren"
    timeout: 3000
- assertNotVisible:
    id: field-due
- assertNotVisible:
    id: snackbar
# Rückgängig über den Verlauf im Drei-Punkte-Menü (4.4).
- tapOn:
    id: nav-menu
- tapOn:
    id: nav-history
- assertVisible:
    id: "history-Zahnarzttermin vereinbaren"
- tapOn:
    id: "history-undo-Zahnarzttermin vereinbaren"
- assertVisible: "Zurückgenommen"
- back
- assertVisible: "Zahnarzttermin vereinbaren"
