# AK-01: Erfassung aus Heute landet im Eingang, nicht in Heute.
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-today
- tapOn:
    id: fab-capture
- tapOn:
    id: capture-title
- inputText: "Maestro Aufgabe"
- tapOn:
    id: capture-submit
- assertNotVisible: "Maestro Aufgabe"
- tapOn:
    id: tab-inbox
- assertVisible: "Maestro Aufgabe"
# Bearbeiten ist ohne Titel ausgegraut; mit Titel erfasst es und öffnet das Detail der neuen Aufgabe.
- tapOn:
    id: fab-capture
- assertVisible:
    id: capture-edit
    enabled: false
- tapOn:
    id: capture-title
- inputText: "Maestro Bearbeiten"
- tapOn:
    id: capture-edit
- assertVisible:
    id: field-title
    text: "Maestro Bearbeiten"
