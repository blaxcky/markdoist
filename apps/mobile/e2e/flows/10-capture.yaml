# AK-01: Erfassung aus Heute landet im Eingang, nicht in Heute.
appId: de.markdoist.aufgaben
---
- runFlow: ../launch.yaml
- tapOn:
    id: tab-today
- tapOn:
    id: fab-capture
- tapOn:
    id: capture-title
- inputText: "Maestro Aufgabe"
- tapOn:
    id: capture-submit
- assertNotVisible: "Maestro Aufgabe"
- tapOn:
    id: tab-inbox
- assertVisible: "Maestro Aufgabe"
# Lange Titel brechen im Feld um und bleiben ganz sichtbar; Enter erfasst trotzdem, statt eine Zeile anzufügen.
# Englischer Text: Die Emulator-Tastatur ist englisch und korrigierte deutsche Wörter (13.11.2026: „einem“ → „Eminem“).
- tapOn:
    id: fab-capture
- tapOn:
    id: capture-title
- inputText: "Maestro very long task with a title that does not fit into one line"
- assertVisible:
    id: capture-title
    text: "(?i)maestro very long task with a title that does not fit into one line"
- pressKey: Enter
- assertNotVisible:
    id: capture-title
- assertVisible: "(?i)maestro very long task.*"
# Zurück bei offener Tastatur schließt das Blatt in einem Schritt, ohne zu erfassen und ohne die Ansicht zu verlassen.
- tapOn:
    id: fab-capture
- tapOn:
    id: capture-title
- inputText: "Maestro Verworfen"
- pressKey: back
- assertNotVisible:
    id: capture-title
- assertVisible:
    id: tab-inbox
- assertNotVisible: "Maestro Verworfen"
# Beschreibung an und wieder aus: Das Feld fällt weg, das Blatt bleibt offen. Ein Tipp daneben schließt es.
- tapOn:
    id: fab-capture
- tapOn:
    id: capture-toggle-note
- tapOn:
    id: capture-toggle-note
- assertVisible:
    id: capture-title
- tapOn:
    id: sheet-close
- assertNotVisible:
    id: capture-title
- assertVisible:
    id: tab-inbox
# Bearbeiten ist ohne Titel ausgegraut; mit Titel erfasst es und öffnet das Detail der neuen Aufgabe.
- tapOn:
    id: fab-capture
- assertVisible:
    id: capture-edit
    enabled: false
- tapOn:
    id: capture-title
- inputText: "Maestro Bearbeiten"
- tapOn:
    id: capture-edit
- assertVisible:
    id: field-title
    text: "Maestro Bearbeiten"
